        "context": "global",
        "key": "cmd+r"
      },
      "bindings": {
        "macos": {
          "context": "global",
          "key": "cmd+r"
        },
        "windows": {
          "context": "global",
          "key": "alt+shift+space"
        }
      },
      "required_platforms": [
        "macos",
        "windows"
      ],
      "divergence_reasons": {
        "windows": "WindowsではWin系標準ショートカットとの競合を避け、Alt+Shift+Spaceを使用する。"
      }
